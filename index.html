<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Este portfólio foi descontinuado. Acesse a nova versão de Alana Soares." />
  <title>Portfólio Descontinuado - Novo Endereço</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <script>
    const novoPortfolioURL = "https://meu-portfolio-gamma-sage.vercel.app/";

    /**
     * Esta função executa o alerta e redireciona o usuário.
     * Usamos setTimeout para garantir que a página renderize antes de alertar/redirecionar.
     */
    function redirecionar() {
      // 1. Exibe o alerta no navegador
      alert("🚨 ATENÇÃO: Este portfólio foi descontinuado! Você será redirecionado(a) automaticamente para a nova versão moderna.");

      // 2. Redireciona para o novo endereço
      window.location.replace(novoPortfolioURL);

      // Opcional: Se o navegador bloquear o redirecionamento, faz uma última tentativa
      setTimeout(() => {
        window.location.replace(novoPortfolioURL);
      }, 500);
    }

    // Chama a função após o DOM ser carregado
    document.addEventListener("DOMContentLoaded", redirecionar);
  </script>

  <style>
    /* Estilo para garantir que a tela fique limpa enquanto o script carrega */
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
  </style>

</head>

<body>
  <div class="container">
    <div class="alert alert-warning shadow-lg" role="alert">
      <h4 class="alert-heading">Portfólio Descontinuado!</h4>
      <p>Esta versão do meu portfólio não está mais ativa.</p>
      <hr>
      <p class="mb-0">
        Por favor, acesse a nova versão:
        <a href="https://meu-portfolio-gamma-sage.vercel.app/" class="alert-link fw-bold">
          https://meu-portfolio-gamma-sage.vercel.app/
        </a>
      </p>
    </div>
  </div>
</body>

</html>
